name: Daily FCA pipeline

on:
  schedule:
    - cron: "17 5 * * *"        # every day 05:17 UTC
  workflow_dispatch:             # "Run workflow" button in the Actions tab
    inputs:
      limit:
        description: "Number of firms to extract"
        required: false
        default: ""

permissions:
  contents: write                # to commit the updated fca.duckdb

concurrency:
  group: fca-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (extract -> dbt build)
        env:
          FCA_API_EMAIL: ${{ secrets.FCA_API_EMAIL }}
          FCA_API_KEY: ${{ secrets.FCA_API_KEY }}
          FCA_FIRM_LIMIT: ${{ inputs.limit || vars.FCA_FIRM_LIMIT || '2000' }}
        run: bash run_pipeline.sh

      - name: Commit updated warehouse
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898296+github-actions[bot]@users.noreply.github.com"
          git add fca.duckdb data/raw/frns.txt
          git diff --cached --quiet || git commit -m "data: FCA refresh $(date -u +%F) [skip ci]"
          git push
